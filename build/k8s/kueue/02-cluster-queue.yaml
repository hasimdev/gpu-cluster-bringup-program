# Cluster-wide quota. Sized to two g5.xlarge nodes (4 vCPU, 16 GiB, 1 GPU each),
# leaving headroom for system pods. A job that asks for more than this waits
# in the queue instead of half-starting, which is what the launch checklist tests.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: research
spec:
  namespaceSelector: {}        # any namespace with a LocalQueue pointing here
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: a10g
          resources:
            - name: cpu
              nominalQuota: 6
            - name: memory
              nominalQuota: 26Gi
            - name: nvidia.com/gpu
              nominalQuota: 2
